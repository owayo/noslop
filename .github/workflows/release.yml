name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: noslop
  # mise 自身の版の正はここ (mise.toml には mise 自身を書けない)。ci.yml と同じ値にそろえる。
  MISE_VERSION: "2026.9.4"

jobs:
  # 配布辞書の目録 (dict/catalog.json) を hasami の最新のリリースに合わせる (make dict-catalog)。
  # 変わっていれば、このジョブで make ci と make dict-check (目録の辞書を実際に取得し、大きさ・SHA-256・
  # 今の依存の hasami で読めることを確かめる) を通してから、artifact で prepare-release に渡す。
  # prepare-release が GITHUB_TOKEN で push するコミットでは ci.yml が走らないので、目録が変わったときの
  # 検査はここで完結させる。書き込みの権限は持たせない (コミットと push は prepare-release だけが行う)
  dictionary-catalog:
    name: Dictionary catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.catalog.outputs.changed }}
      tag: ${{ steps.catalog.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      # 最新のリリースと dictionaries.json を gh で取る (outputs: changed・tag)
      - name: Update dictionary catalog
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: make dict-catalog

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.catalog.outputs.changed == 'true'

      - name: Set up
        if: steps.catalog.outputs.changed == 'true'
        run: make setup

      - name: Run checks (make ci)
        if: steps.catalog.outputs.changed == 'true'
        run: make ci

      - name: Download and verify the dictionaries (make dict-check)
        if: steps.catalog.outputs.changed == 'true'
        run: make dict-check

      - name: Upload dictionary catalog
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dictionary-catalog
          path: dict/catalog.json
          if-no-files-found: error

  prepare-release:
    name: Prepare Release
    needs: dictionary-catalog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # dictionary-catalog が新しい目録を取り込んで確かめたら、このリリースのコミットに含める
      - name: Download dictionary catalog
        if: needs.dictionary-catalog.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dictionary-catalog
          path: dict

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          # Use 2-digit year (YY) for Windows MSI compatibility (major version must be <= 255)
          YEAR=$(date +%y)
          MONTH=$(date +%-m)

          CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Current version: ${CURRENT}"

          if echo "${CURRENT}" | grep -qE '^[0-9]{2,4}\.[0-9]{1,2}\.[0-9]+$'; then
            OLD_YEAR=$(echo "${CURRENT}" | cut -d. -f1)
            OLD_MONTH=$(echo "${CURRENT}" | cut -d. -f2)
            OLD_COUNTER=$(echo "${CURRENT}" | cut -d. -f3)
            # Handle both 2-digit and 4-digit year formats
            OLD_YEAR_2DIGIT="${OLD_YEAR#20}"
            if [ "${OLD_YEAR_2DIGIT}" = "${YEAR}" ] && [ "${OLD_MONTH}" = "${MONTH}" ]; then
              NEW_COUNTER=$((OLD_COUNTER + 1))
            else
              NEW_COUNTER=100
            fi
          else
            NEW_COUNTER=100
          fi

          NEW_VERSION="${YEAR}.${MONTH}.${NEW_COUNTER}"
          TAG="v${NEW_VERSION}"
          echo "New version: ${NEW_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          # [package] の version (ファイル内で最初の `version = ...` 行) だけを書き換える
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${NEW_VERSION}\"/" Cargo.toml

          # 依存の版は上げず、Cargo.lock の noslop 自身の版だけを更新する
          cargo update --workspace

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: ${{ inputs.dry_run != true }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          CATALOG_CHANGED: ${{ needs.dictionary-catalog.outputs.changed }}
          CATALOG_TAG: ${{ needs.dictionary-catalog.outputs.tag }}
        run: |
          set -euo pipefail
          # 目録が変わっていなければ dict/catalog.json の差分は無い
          git add Cargo.toml Cargo.lock dict/catalog.json
          message=(-m "Release ${TAG}")
          if [ "${CATALOG_CHANGED}" = "true" ]; then
            message+=(-m "配布辞書の目録を hasami ${CATALOG_TAG} に更新")
          fi
          git commit "${message[@]}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${{ github.ref_name }}" "${TAG}"

      - name: Dry run info
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "🧪 Dry run mode - skipping commit and tag"
          echo "Would release: ${{ steps.bump.outputs.tag }}"
          git diff -- Cargo.toml Cargo.lock dict/catalog.json

  build-and-release:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    if: ${{ inputs.dry_run != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: noslop
            asset_name: noslop-linux-amd64
          # arm64 の Linux は、arm64 のランナーでそのままビルドする (クロスビルドの道具が要らない)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: noslop
            asset_name: noslop-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: noslop
            asset_name: noslop-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: noslop
            asset_name: noslop-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: noslop.exe
            asset_name: noslop-windows-amd64.exe

    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      # Rust の版は mise.toml が正
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      # mise が入れたツールチェーンにクロスビルド用のターゲットを足す
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [prepare-release, build-and-release]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      # バイナリには同梱の辞書 (IPAdic、NAIST-2003) が入るので、ライセンスの表示を添える
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: |
            LICENSE
            THIRD_PARTY_NOTICES.md
          sparse-checkout-cone-mode: false

      - name: Add license notices
        run: cp source/LICENSE source/THIRD_PARTY_NOTICES.md release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          # タイトルはタグ名だけにする (「Release v26.9.100」のように Release を付けない)
          name: ${{ needs.prepare-release.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: echo "🚀 Released ${{ needs.prepare-release.outputs.tag }}"

  # Homebrew の tap (owayo/homebrew-noslop) の formula を、公開したリリースの版に書き換える。
  # tap は別のリポジトリなので GITHUB_TOKEN では push できず、GitHub App のトークン
  # (Variables の APP_CLIENT_ID と Secrets の PRIVATE_KEY) を使う。GITHUB_TOKEN で作ったリリースは
  # ほかのワークフロー (on: release) を起動しないので、同じワークフローの後続のジョブにしている
  update-homebrew:
    name: Update Homebrew tap
    needs: [prepare-release, publish-release]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      # 設定がなければリリース全体を落とさずに飛ばす (jobs.<id>.if では secrets を参照できない)
      - name: Check GitHub App settings
        id: app
        env:
          CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APP_CLIENT_ID (Variables) か PRIVATE_KEY (Secrets) がないので、Homebrew の tap を更新しません"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # 公開したリリースの SHA256SUMS から、formula が指すバイナリの SHA-256 を読む
      - name: Read checksums
        id: sums
        if: steps.app.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHA256SUMS
          for asset in noslop-darwin-arm64 noslop-darwin-amd64 noslop-linux-arm64 noslop-linux-amd64; do
            sum="$(awk -v f="$asset" '$2 == f { print $1 }' SHA256SUMS)"
            if [ "${#sum}" -ne 64 ]; then
              echo "::error::SHA256SUMS に ${asset} がありません"
              exit 1
            fi
            echo "${asset//-/_}=${sum}" >> "$GITHUB_OUTPUT"
          done

      # App のトークンは tap を触る直前に作る (トークンに手が届く時間を短くする)
      - name: Generate GitHub App token
        id: app-token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-noslop
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.app.outputs.enabled == 'true'
        with:
          repository: ${{ github.repository_owner }}/homebrew-noslop
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Update formula
        if: steps.app.outputs.enabled == 'true'
        working-directory: tap
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.sums.outputs.noslop_darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.sums.outputs.noslop_darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sums.outputs.noslop_linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sums.outputs.noslop_linux_amd64 }}
        run: |
          mkdir -p Formula
          # 展開するのは ${...} だけ (Ruby の #{...} はシェルでは展開されない)。版は URL
          # (/download/v<版>/) から Homebrew が読むので、version は書かない (brew audit --strict が冗長と指摘する)
          cat > Formula/noslop.rb <<FORMULA
          class Noslop < Formula
            desc "Linter that flags AI-sounding patterns in Japanese text"
            homepage "https://github.com/${{ github.repository }}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/noslop-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${BASE_URL}/noslop-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/noslop-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${BASE_URL}/noslop-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              # リリースの添付は圧縮していないバイナリ (noslop-<OS>-<CPU>) なので、名前を noslop に直して入れる
              binary = Dir["noslop-*"].first
              chmod 0755, binary
              bin.install binary => "noslop"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/noslop --version")
              (testpath/"draft.md").write "まとめると、この方針が大切だと言えるでしょう。\n"
              output = shell_output("#{bin}/noslop check --no-config --format json draft.md")
              assert_match(/"ruleId":\s*"P01"/, output)
            end
          end
          FORMULA
          git diff --stat
          if git diff --quiet; then
            echo "formula は ${TAG} のまま (変更なし)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/noslop.rb
          git commit -m "noslop を ${TAG} に更新"
          git push
          echo "🍺 Homebrew の tap を ${TAG} に更新しました: ${{ github.repository_owner }}/homebrew-noslop"
