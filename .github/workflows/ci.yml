name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Rust の版は mise.toml が正 (clippy / rustfmt もそこで入る)
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      # 検査の中身は Makefile の ci が定義する (fmt-check・clippy・test・docs/rules.md の差分・
      # 辞書を同梱しないビルドのテスト)。
      # 検査を足すときは Makefile の ci に足す
      - name: Set up
        run: make setup

      - name: Run checks (make ci)
        run: make ci

  build:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # mise が入れた (mise.toml の版の) ツールチェーンにターゲットを足す
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # Windows のランナーの make は MinGW の mingw32-make の写しで、レシピの POSIX シェル前提の
      # 解釈に癖があるため make を使わない。make ci と同じ cargo のコマンドを直接呼ぶ
      # (Makefile の ci を変えたらここも合わせる。docs/rules.md の差分は Linux と macOS で見る)
      - name: Check formatting (Windows)
        if: runner.os == 'Windows'
        run: cargo fmt --all -- --check

      - name: Run clippy (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --no-fail-fast

      - name: Run tests without the bundled dictionary (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --no-default-features --no-fail-fast

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
