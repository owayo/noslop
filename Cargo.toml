[package]
name = "noslop"
version = "26.9.105"
edition = "2024"
rust-version = "1.98"
description = "日本語の文章から「AI 臭さ」を機械的に拾う Linter"
license = "MIT"
repository = "https://github.com/owayo/noslop"
homepage = "https://github.com/owayo/noslop"
readme = "README.md"
keywords = ["linter", "japanese", "writing", "markdown", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "noslop"
path = "src/main.rs"

[lib]
name = "noslop"
path = "src/lib.rs"

[features]
default = ["bundled-dict"]
# 形態素解析の辞書 (dict/ipadic.hsd、約 18MB) をバイナリに埋め込む。外すと、辞書は --dict・設定の
# dictionary・HASAMI_DICT・~/.local/share/hasami から探し、なければ辞書なしの近似で判定する
bundled-dict = []

[dependencies]
aho-corasick = "1.1.5"
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
globset = "0.4.20"
# 文分割 (辞書を使わない hasami::sentence) と、辞書があるときの形態素解析 (analyzer)、配布辞書の取得
# (download。noslop dict download が使う。HTTP は ureq の rustls で、社内の CA を入れた環境でも通るよう
# OS の証明書ストアで検証する。圧縮版の展開は ruzstd)。crates.io の同名クレートは別物なので、git の
# タグで入れる。既定の feature (cli) は辞書の構築と CLI の依存を引くので切る
hasami = { git = "https://github.com/owayo/hasami", tag = "v26.9.105", default-features = false, features = ["analyzer", "download"] }
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# gws のフックが止めた書き込みの記録の名前 (セッション・書き込み先・値のハッシュ)。hasami の download と
# 同じ版で、依存の木に新しく加わらない
sha2 = "0.11.0"
thiserror = "2.0.21"
# 既定の feature (cli) は TUI の依存を引くので切る
toon-format = { version = "0.5.0", default-features = false }
toml = "1.1.6"
# コードのコメントの取り出しと、gws のコマンドの解析 (Bash)。文法はすべて常に入れる (feature で分けない)。
# 文法の crate は tree-sitter 0.27 で読める版に固定する (上げるときは文法ごとに tree-sitter の ABI の
# 対応を確かめる)
tree-sitter = "0.27.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-css = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-php = "=0.24.2"
tree-sitter-python = "=0.25.0"
# astro-sight と同じく owayo のフォークを使う
tree-sitter-ruby = { git = "https://github.com/owayo/tree-sitter-ruby.git", branch = "master" }
tree-sitter-rust = "=0.24.2"
# SQL (tree-sitter-sequel) は入れない: cc を ~1.2 に固定させ、ring が引く新しい cc とぶつかるため
tree-sitter-swift = "=0.7.3"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
# テストで小さな辞書を組み立てる (build)。CI に辞書を置かずに、辞書ありの判定を確かめるため
hasami = { git = "https://github.com/owayo/hasami", tag = "v26.9.105", default-features = false, features = ["analyzer", "build", "download"] }
predicates = "3.1.4"
tempfile = "3.27.0"

# build.rs で配布辞書の目録 (dict/catalog.json) を読み、検証して定数を作る
[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
