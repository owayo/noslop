[package]
name = "noslop"
version = "26.9.104"
edition = "2024"
rust-version = "1.98"
description = "日本語の文章から「AI 臭さ」を機械的に拾う Linter"
license = "MIT"
repository = "https://github.com/owayo/noslop"
homepage = "https://github.com/owayo/noslop"
readme = "README.md"
keywords = ["linter", "japanese", "writing", "markdown", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "noslop"
path = "src/main.rs"

[lib]
name = "noslop"
path = "src/lib.rs"

[features]
default = ["bundled-dict", "code"]
# 形態素解析の辞書 (dict/ipadic.hsd、約 18MB) をバイナリに埋め込む。外すと、辞書は --dict・設定の
# dictionary・HASAMI_DICT・~/.local/share/hasami から探し、なければ辞書なしの近似で判定する
bundled-dict = []
# コードのコメントを読む文法 (tree-sitter)。code は軽い文法 (合わせて約 7.6MiB) をまとめたもので、
# 既定で入れる。重い文法 (1 つで 2〜5MiB) は code-all か言語ごとの feature で足す。Bash の文法は
# gws のコマンドの解析にも使うので、feature によらず常に入れる
code = [
    "lang-rust",
    "lang-javascript",
    "lang-typescript",
    "lang-python",
    "lang-go",
    "lang-java",
    "lang-c",
    "lang-yaml",
    "lang-toml",
    "lang-html",
    "lang-css",
    "lang-lua",
]
code-all = [
    "code",
    "lang-cpp",
    "lang-csharp",
    "lang-ruby",
    "lang-php",
    "lang-swift",
    "lang-kotlin",
]
lang-rust = ["dep:tree-sitter-rust"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-c = ["dep:tree-sitter-c"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-lua = ["dep:tree-sitter-lua"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-php = ["dep:tree-sitter-php"]
lang-swift = ["dep:tree-sitter-swift"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]

[dependencies]
aho-corasick = "1.1.5"
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
globset = "0.4.20"
# 文分割 (辞書を使わない hasami::sentence) と、辞書があるときの形態素解析 (analyzer)、配布辞書の取得
# (download。noslop dict download が使う。HTTP は ureq の rustls で、社内の CA を入れた環境でも通るよう
# OS の証明書ストアで検証する。圧縮版の展開は ruzstd)。crates.io の同名クレートは別物なので、git の
# タグで入れる。既定の feature (cli) は辞書の構築と CLI の依存を引くので切る
hasami = { git = "https://github.com/owayo/hasami", tag = "v26.9.105", default-features = false, features = ["analyzer", "download"] }
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# gws のフックが止めた書き込みの記録の名前 (セッション・書き込み先・値のハッシュ)。hasami の download と
# 同じ版で、依存の木に新しく加わらない
sha2 = "0.11.0"
thiserror = "2.0.21"
# 既定の feature (cli) は TUI の依存を引くので切る
toon-format = { version = "0.5.0", default-features = false }
toml = "1.1.6"
# コードのコメントの取り出し (code) と、gws のコマンドの解析 (Bash)。文法の crate は tree-sitter 0.27 で
# 読める版に固定する (上げるときは文法ごとに tree-sitter の ABI の対応を確かめる)
tree-sitter = "0.27.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = { version = "=0.24.2", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-kotlin-ng = { version = "=1.1.0", optional = true }
tree-sitter-lua = { version = "=0.5.0", optional = true }
tree-sitter-php = { version = "=0.24.2", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
# astro-sight と同じく owayo のフォークを使う
tree-sitter-ruby = { git = "https://github.com/owayo/tree-sitter-ruby.git", branch = "master", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
# SQL (tree-sitter-sequel) は入れない: cc を ~1.2 に固定させ、ring が引く新しい cc とぶつかるため
tree-sitter-swift = { version = "=0.7.3", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-yaml = { version = "=0.7.2", optional = true }
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
# テストで小さな辞書を組み立てる (build)。CI に辞書を置かずに、辞書ありの判定を確かめるため
hasami = { git = "https://github.com/owayo/hasami", tag = "v26.9.105", default-features = false, features = ["analyzer", "build", "download"] }
predicates = "3.1.4"
tempfile = "3.27.0"

# build.rs で配布辞書の目録 (dict/catalog.json) を読み、検証して定数を作る
[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
