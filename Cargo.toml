[package]
name = "noslop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast linter that flags AI-generated \"slop\" patterns in Japanese prose"
license = "MIT"
repository = "https://github.com/owayo/noslop"
homepage = "https://github.com/owayo/noslop"
readme = "README.md"
keywords = ["linter", "japanese", "writing", "markdown", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "noslop"
path = "src/main.rs"

[lib]
name = "noslop"
path = "src/lib.rs"

[features]
default = ["bundled-dict"]
# 形態素解析の辞書 (dict/ipadic.hsd、約 18MB) をバイナリに埋め込む。外すと、辞書は --dict・設定の
# dictionary・HASAMI_DICT・~/.local/share/hasami から探し、なければ辞書なしの近似で判定する
bundled-dict = []

[dependencies]
aho-corasick = "1.1.5"
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
globset = "0.4.20"
# 文分割 (辞書を使わない hasami::sentence) と、辞書があるときの形態素解析 (analyzer)。
# crates.io の同名クレートは別物なので、git のタグで入れる。既定の feature (cli) は辞書の構築と
# CLI の依存を引くので切る
hasami = { git = "https://github.com/owayo/hasami", tag = "v26.9.103", default-features = false, features = ["analyzer"] }
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
# 既定の feature (cli) は TUI の依存を引くので切る
toon-format = { version = "0.5.0", default-features = false }
toml = "1.1.6"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
# テストで小さな辞書を組み立てる (build)。CI に辞書を置かずに、辞書ありの判定を確かめるため
hasami = { git = "https://github.com/owayo/hasami", tag = "v26.9.103", default-features = false, features = ["analyzer", "build"] }
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
