# noslop の設定ファイルの例。
#
# 設定ファイルは 2 つあり、どちらもこの書き方で書ける。
#   ユーザーの設定     ~/.config/noslop/config.toml (Windows は %USERPROFILE%\.config\noslop\config.toml)。
#                      手元のマシンでだけ使う設定 (辞書の選び方など) を書く。自動では作らない
#                      (ひな形は `noslop init --user` で作れる)
#   プロジェクトの設定 noslop.toml (または .noslop.toml)。カレントディレクトリから親へ向かって探し、
#                      最初に見つかった 1 つを使う。`--config <PATH>` で差し替えられる
#
# 両方あるときは、ユーザーの設定にプロジェクトの設定を重ねる (既定値 < ユーザーの設定 <
# プロジェクトの設定 < コマンドラインのオプション)。上書きするのは書いた項目だけで、配列は丸ごと
# 置き換える。ルールの有効・無効と [rules.<ID>] の項目はルールごとに重ね、[[custom]] は両方を使う
# (同じ ID はプロジェクトの定義に置き換える)。`--no-config` はどちらも読まない。
#
# どの項目も省略でき、省略すると下に書いた既定値になる。

# 文書のジャンル。閾値が切り替わり、ジャンルの慣習と衝突するルールが止まる。
#   general  既定。どのジャンルにも偏らない保守的な閾値
#   tech     技術文書・技術ブログ
#   business ビジネス文書 (報告書・提案書・議事録)。別名 minutes
#   essay    エッセイ・ブログ。別名 blog
genre = "general"

# 実験的なルール・語句 (未校正、または辞書なしの近似) をすべて有効にする。
# 個別に有効にしたいときは、下の [rules.<ID>] に enabled = true を書く。
experimental = false

# この重大度以上の指摘があれば終了コード 1 にする。
#   never (既定) / info / warning / error
# noslop は疑いを示す道具なので、既定では件数でジョブを落とさない。
fail_on = "never"

# 段落内の改行の扱い。
#   space    改行を文の区切りにしない (既定。Markdown の折り返しは見た目上の改行)
#   sentence 改行を文の区切りにする (句点を打たずに一文一行で書く文書向け)
# どちらでも、書式から文の区切りと分かる改行 (「・」「①」などで始まる行の前、「目的：」のような
# 見出しの行や太字だけの行の後、「〜です」「〜ください」で終わる行の後など) では文を切る。
line_breaks = "space"

[files]
# ディレクトリを渡したときに対象にする拡張子。直接指定したファイルは拡張子を問わない。
extensions = ["md", "markdown", "txt"]

# 対象から外すパス。.gitignore と同じ書式で、この設定ファイルのディレクトリを基準にする
# (ユーザーの設定に書いたときは、noslop check に渡したディレクトリが基準)。プロジェクトの設定に
# 書くと、ユーザーの設定の exclude は使わない (exclude = [] で打ち消せる)。
# .gitignore・.ignore・.noslopignore に書かれたものは、ここに書かなくても外れる。
exclude = [
  "CHANGELOG.md",
  "vendor/**",
  "node_modules/**",
]

[code]
# コメントを検査するコードの拡張子。ディレクトリを渡したときと、フックで集める (既定は空で、コードは
# 集めない)。直接指定したコードのファイルは、ここに書かなくてもコメントを検査する。
# コメントは互いに独立した短い断片なので、1 文ずつ判定するルール (語句・文の長さなど) だけを当てる。
# コードの拡張子でないもの (読める言語は README の「コードのコメント」) を書くと誤りになる。
# 次は読める拡張子すべて。使うものだけを残す。
extensions = [
  "rs",                                    # Rust
  "js", "mjs", "cjs", "jsx",               # JavaScript
  "ts", "mts", "cts",                      # TypeScript
  "tsx",                                   # TSX
  "py", "pyi",                             # Python
  "go",                                    # Go
  "java",                                  # Java
  "c", "h",                                # C
  "cc", "cpp", "cxx", "hh", "hpp", "hxx",  # C++
  "cs",                                    # C#
  "rb",                                    # Ruby
  "php",                                   # PHP
  "swift",                                 # Swift
  "kt", "kts",                             # Kotlin
  "sh", "bash", "zsh",                     # Bash
  "yaml", "yml",                           # YAML
  "toml",                                  # TOML
  "html", "htm",                           # HTML
  "css",                                   # CSS
  "lua",                                   # Lua
]

[scope]
# 語句パターン系ルール (P) がどのブロックを見るか。
# 校正は地の文 (段落) で行ったため、既定は段落だけ。広げると校正の前提 (誤検知率) から外れる。
# リズム・統計系ルール (R) はこの設定に関わらず地の文だけで集計する。
lists = false        # 箇条書きの項目
tables = false       # 表のセル
blockquotes = false  # 引用 (> で始まる部分)

[morphology]
# 形態素解析の辞書 (hasami の .hsd)。「の」の連鎖 (P16) と連続漢字 (P15) を品詞で判定する。
# 辞書を使うかどうか。
#   auto     辞書が見つかれば使う (既定。同梱の辞書があるので、既定のビルドでは必ず見つかる)
#   required 必ず使う。同梱しないビルドで見つからなければ設定の誤りにする
#   off      使わない (辞書なしの近似で判定する)
mode = "auto"
# 使う辞書。
#   auto          次の順に探し、最初に見つかったものを使う (既定)
#                 HASAMI_DICT → hasami の share ディレクトリの配布辞書 (hasami の推奨順。
#                 ipadic-neologd-sudachi → ipadic-neologd → ipadic) → 同梱の辞書
#   bundled       バイナリに同梱した IPAdic の辞書 (品詞で数えるルールを校正した条件)
#   share:<名前>  `noslop dict download <名前>` で取得した配布辞書 (share ディレクトリの <名前>.hsd。
#                 既定は ~/.local/share/hasami/<名前>.hsd で、HASAMI_DATA_DIR・XDG_DATA_HOME で変わる)
#   それ以外      辞書のファイルのパス。相対パスはこの設定ファイルのディレクトリが基準で、~/ は
#                 ホームディレクトリ。auto・bundled という名前のファイルは ./auto のように書く
# 見つかった辞書が読めなければ設定の誤りにする (次の候補や同梱の辞書に切り替えない)。auto の辞書は
# 手元に取得した辞書で変わるので、結果をそろえたい場面 (CI など) では bundled か share:<名前> で
# 固定する。品詞で数えるルールは同梱の IPAdic で校正しているので、ほかの辞書では結果が変わることがある。
dictionary = "auto"

# ルールごとの設定。表の名前はルールの ID か名前 (例: [rules.AI_CONCLUSION])。
# 共通の項目:
#   enabled  = true / false   有効・無効を切り替える (実験的ルールの個別の有効化もこれ)
#   severity = "info" / "warning" / "error"   重大度を変える
# ルール固有の閾値は `noslop explain <ID>` に一覧がある。閾値は校正の前提を崩すので、
# 変えるときは理由をコメントに残すこと。

[rules.P04]
# 冗長な動詞表現 (実験的)。「〜を行う」を多用する文書で見直したいときに有効にする。
enabled = true

[rules.P05]
# ぼやけた修飾語 (実験的)。人間の文章にも多い語なので、既定では無効。
enabled = false

[rules.R01]
# 文長の単調さ。地の文が min_sentences 文以上あるとき、burstiness が threshold 未満なら警告。
# 文数が info_min_sentences 以上 min_sentences 未満のときは、info_threshold 未満で情報を出す。
# severity を書くと、この 2 段の重大度がどちらもその値に置き換わる点に注意。
threshold = -0.38
min_sentences = 20
info_threshold = -0.45
info_min_sentences = 10

[rules.R03]
# 長すぎる一文 (読みやすさ)。この文字数を超える文を指摘する。essay の既定は 110。
max_chars = 90

[rules.R05]
# 否定→肯定の対比の反復。min_count 回以上あるとき、総文数に対する比率で重大度を決める。
#   比率 < info_below          → info
#   info_below 〜 error_above  → warning
#   比率 >= error_above         → error (tech の既定は 0.045)
min_count = 3
info_below = 0.02
error_above = 0.03

[rules.S03]
# 「まとめ」「おわりに」などの定型見出し (実験的)。
enabled = false

# チーム独自の禁止語・言い換え。何個でも書ける。
# ID は組み込みルールと重ならないものにする (例: X01)。
# 独自ルールの指摘は、AI 臭さとは分けて「独自ルールの指摘」として出る。
[[custom]]
id = "X01"
name = "BANNED_HONORIFIC"
# 探す文字列。regex = true なら正規表現 (Rust の regex 構文)。
pattern = "ユーザー様"
regex = false
message = "「ユーザー様」ではなく「利用者」と書く"
hint = "用字用語集の表記に合わせてください"
severity = "warning"   # info / warning / error
# 指摘を載せるレーン。出力では custom を「独自ルール」、slop を「AI 臭さ」、readability を「読みやすさ」と呼ぶ。
lane = "custom"        # custom (既定) / slop / readability

[[custom]]
id = "X02"
name = "VAGUE_SCHEDULE"
pattern = "(近日|早急に|速やかに)(対応|実施|公開)"
regex = true
message = "期日の分からない言い方です"
hint = "日付か、何が済んだら着手するかを書いてください"
severity = "info"
